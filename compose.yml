
services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: app_dbs
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: app_adminer_a
    ports:
      - "8081:8080"
    networks:
      - app_network

  # Backend Express.js
  backend:
    build: ./backend
    container_name: app_backend_a
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://appuser:apppassword@postgres:5432/appdb
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    command: npm run dev

  # Frontend React + Vite
  frontend:
    build: ./front
    container_name: app_frontend
    environment:
      VITE_BACKEND_URL: http://backend:5000
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app_network
    command: npm run dev


volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
